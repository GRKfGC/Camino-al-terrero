<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camino al Terrero</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 10% 10%,#ff1744 0,transparent 28%),
        radial-gradient(circle at 90% 80%,#304ffe 0,transparent 30%),
        linear-gradient(135deg,#090b1a,#24144b);
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   CREACIÓN
========================= */

#creationScreen{
    min-height:100vh;
    padding:25px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.creation-container{
    width:100%;
    max-width:1050px;
}

.logo{
    text-align:center;
    font-size:clamp(38px,7vw,72px);
    font-weight:1000;
    text-transform:uppercase;
    text-shadow:5px 5px 0 #000;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    opacity:.8;
    margin-bottom:25px;
}

.creation-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    padding:25px;
    border-radius:28px;
    background:rgba(255,255,255,.11);
    border:2px solid rgba(255,255,255,.16);
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    backdrop-filter:blur(12px);
}

.card h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:15px;
    border:0;
    outline:0;
    border-radius:14px;
    background:#fff;
    color:#111;
}

.preview{
    min-height:100%;
    display:flex;
    flex-direction:column;
}

.avatar{
    width:125px;
    height:125px;
    margin:5px auto 15px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:65px;
    background:linear-gradient(135deg,#ff1744,#ff9100);
    border:5px solid rgba(255,255,255,.4);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.player-name{
    text-align:center;
    font-size:28px;
    font-weight:900;
}

.badge{
    width:max-content;
    margin:8px auto 20px;
    padding:8px 18px;
    border-radius:20px;
    background:#ff1744;
    font-weight:bold;
}

.team-preview{
    padding:15px;
    text-align:center;
    border-radius:15px;
    background:rgba(0,0,0,.2);
    margin-bottom:15px;
}

.stat{
    margin:12px 0;
}

.stat-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:5px;
}

.bar{
    height:10px;
    border-radius:20px;
    overflow:hidden;
    background:rgba(255,255,255,.15);
}

.bar-fill{
    height:100%;
    width:0;
    border-radius:20px;
    background:linear-gradient(90deg,#00e5ff,#7c4dff);
    transition:width .4s;
}

.trait{
    margin-top:18px;
    padding:12px;
    text-align:center;
    border-radius:14px;
    background:linear-gradient(135deg,#ff9100,#e91e63);
    font-weight:bold;
}

.primary{
    width:100%;
    padding:17px;
    margin-top:20px;
    border:0;
    border-radius:16px;
    color:white;
    font-weight:900;
    background:linear-gradient(135deg,#ff1744,#ff6d00);
    box-shadow:0 8px 25px rgba(255,23,68,.3);
    transition:.2s;
}

.primary:hover{
    transform:scale(1.025);
}

.secondary{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:14px;
    color:white;
    background:rgba(255,255,255,.12);
}

/* =========================
   JUEGO
========================= */

#gameScreen{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.header{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:15px;
}

.header-card{
    padding:14px;
    text-align:center;
    border-radius:16px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15);
}

.header-card small{
    opacity:.65;
}

.header-card strong{
    display:block;
    margin-top:5px;
}

.layout{
    display:grid;
    grid-template-columns:1fr 310px;
    gap:15px;
}

.panel{
    padding:25px;
    border-radius:25px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

#eventTitle{
    font-size:30px;
    font-weight:900;
    margin-bottom:12px;
}

#eventText{
    line-height:1.6;
    margin-bottom:22px;
}

#actions{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.action-button{
    width:100%;
    padding:17px;
    text-align:left;
    border:0;
    border-radius:17px;
    color:white;
    font-weight:700;
    background:linear-gradient(135deg,#3949ab,#7b1fa2);
    box-shadow:0 6px 15px rgba(0,0,0,.2);
    transition:.2s;
}

.action-button:hover{
    transform:translateX(7px);
    filter:brightness(1.2);
}

.danger{
    background:linear-gradient(135deg,#8b0000,#3b1010);
}

.news{
    margin-top:15px;
}

.news h3{
    margin-top:0;
}

.news-item{
    padding:10px;
    margin:8px 0;
    border-radius:12px;
    font-size:13px;
    background:rgba(0,0,0,.2);
}

.fight{
    padding:20px;
    text-align:center;
    border-radius:20px;
    background:linear-gradient(135deg,#7b1fa2,#311b92);
}

.opponent{
    margin:12px 0;
    font-size:25px;
    font-weight:900;
}

/* =========================
   MODAL
========================= */

#modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:rgba(0,0,0,.8);
}

.modal-box{
    width:100%;
    max-width:600px;
    padding:30px;
    text-align:center;
    border-radius:25px;
    background:linear-gradient(145deg,#29294d,#16162c);
    border:2px solid rgba(255,255,255,.2);
    box-shadow:0 25px 80px rgba(0,0,0,.6);
    animation:appear .3s ease;
}

.modal-box h2{
    font-size:30px;
}

.modal-box p{
    line-height:1.6;
    opacity:.9;
}

@keyframes appear{
    from{
        opacity:0;
        transform:scale(.75);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@media(max-width:800px){

    .creation-grid{
        grid-template-columns:1fr;
    }

    .layout{
        grid-template-columns:1fr;
    }

    .header{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){

    #creationScreen{
        padding:12px;
    }

    .card{
        padding:18px;
    }

    #gameScreen{
        padding:10px;
    }

    .panel{
        padding:18px;
    }

    #eventTitle{
        font-size:24px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     CREACIÓN DEL LUCHADOR
===================================================== -->

<section id="creationScreen">

<div class="creation-container">

    <div class="logo">
        Camino al Terrero
    </div>

    <div class="subtitle">
        Crea tu luchador y comienza tu carrera
    </div>

    <div class="creation-grid">

        <!-- DATOS -->

        <div class="card">

            <h2>🥋 Crear luchador</h2>

            <label for="nameInput">
                Nombre
            </label>

            <input
                id="nameInput"
                type="text"
                maxlength="25"
                placeholder="Escribe tu nombre">


            <label for="ageInput">
                Edad
            </label>

            <input
                id="ageInput"
                type="number"
                min="12"
                max="18"
                value="15">


            <label for="islandSelect">
                Isla
            </label>

            <select id="islandSelect">

                <option value="">
                    Selecciona una isla
                </option>

                <option value="Fuerteventura">
                    Fuerteventura
                </option>

                <option value="Gran Canaria">
                    Gran Canaria
                </option>

                <option value="Tenerife">
                    Tenerife
                </option>

                <option value="La Palma">
                    La Palma
                </option>

            </select>


            <label for="teamSelect">
                Equipo
            </label>

            <select id="teamSelect">

                <option value="">
                    Selecciona primero una isla
                </option>

            </select>


            <button
                id="generateButton"
                class="secondary"
                type="button">

                🎲 Generar estadísticas

            </button>


            <button
                id="startButton"
                class="primary"
                type="button">

                🥋 COMENZAR CARRERA

            </button>

        </div>


        <!-- PREVISUALIZACIÓN -->

        <div class="card preview">

            <h2>👤 Tu luchador</h2>

            <div id="avatar" class="avatar">
                🥋
            </div>

            <div
                id="previewName"
                class="player-name">

                Tu nombre

            </div>

            <div
                id="previewCategory"
                class="badge">

                CADETE

            </div>

            <div
                id="previewTeam"
                class="team-preview">

                Selecciona un equipo

            </div>


            <div id="previewStats">

                <!-- Se rellena con JS -->

            </div>


            <div id="previewTrait">

                <!-- característica -->

            </div>

        </div>

    </div>

</div>

</section>


<!-- =====================================================
     JUEGO
===================================================== -->

<section
    id="gameScreen"
    class="hidden">

    <div class="header">

        <div class="header-card">
            <small>Luchador</small>
            <strong id="uiName">---</strong>
        </div>

        <div class="header-card">
            <small>Categoría</small>
            <strong id="uiCategory">Cadete</strong>
        </div>

        <div class="header-card">
            <small>Equipo</small>
            <strong id="uiTeam">---</strong>
        </div>

        <div class="header-card">
            <small>Decisiones</small>
            <strong id="uiDecisions">0</strong>
        </div>

    </div>


    <div class="layout">

        <main class="panel">

            <div id="eventTitle">
                Tu carrera comienza
            </div>

            <div id="eventText">
                Prepárate para tu primer día.
            </div>

            <div id="actions"></div>

        </main>


        <aside>

            <div class="panel">

                <h2>📊 Estadísticas</h2>

                <div id="stats"></div>

                <div id="trait"></div>

            </div>


            <div class="panel news">

                <h3>📰 Noticias de última hora</h3>

                <div id="newsList"></div>

            </div>

        </aside>

    </div>

</section>


<!-- =====================================================
     MODAL
===================================================== -->

<div
    id="modal"
    class="hidden">

    <div class="modal-box">

        <h2 id="modalTitle"></h2>

        <p id="modalText"></p>

        <button
            id="modalButton"
            class="primary"
            type="button">

            CONTINUAR

        </button>

    </div>

</div>


<script>

/* =====================================================
   EQUIPOS
===================================================== */

const teams = {

    Fuerteventura: [
        "Club de lucha Unión Antigua ⚪🟢",
        "Rosario Club de Lucha 🔵🔴",
        "Club de lucha Unión Tetir 🔵⚪"
    ],

    "Gran Canaria": [
        "Club de lucha Adargoma ⚪🔴",
        "Club de lucha Castillo del Romeral 🟡🔵",
        "Club de lucha Castro Morales ⚫⚪"
    ],

    Tenerife: [
        "Club de lucha Chimbesque 🟡🔵",
        "Club de lucha Campitos 🟢⚪",
        "Club de lucha Rosario Valle Guerra ⚪🔴"
    ],

    "La Palma": [
        "Club de lucha Aridane 🟠🔵",
        "Club de lucha Candelaria 🔵⚪",
        "Club de lucha Bediesta ⚫🟢"
    ]

};


/* =====================================================
   JUGADOR
===================================================== */

const player = {

    name:"",
    age:15,
    island:"",
    team:"",

    category:"Cadete",

    decisions:0,
    fights:0,

    seniorCallup:false,
    careerOver:false,

    generated:false,

    trait:"Normal",

    stats:{
        fuerza:0,
        tecnica:0,
        resistencia:0,
        velocidad:0,
        mentalidad:0
    }

};


/* =====================================================
   ELEMENTOS
===================================================== */

const islandSelect =
    document.getElementById("islandSelect");

const teamSelect =
    document.getElementById("teamSelect");

const nameInput =
    document.getElementById("nameInput");

const ageInput =
    document.getElementById("ageInput");


/* =====================================================
   CAMBIAR ISLA
===================================================== */

islandSelect.addEventListener(
    "change",
    function(){

        const island = this.value;

        teamSelect.innerHTML = "";

        if(!island){

            teamSelect.innerHTML =
                `<option value="">
                    Selecciona primero una isla
                 </option>`;

            updatePreview();

            return;
        }

        teams[island].forEach(function(team){

            const option =
                document.createElement("option");

            option.value = team;
            option.textContent = team;

            teamSelect.appendChild(option);

        });

        updatePreview();

    }
);


/* =====================================================
   ACTUALIZAR PREVISUALIZACIÓN
===================================================== */

nameInput.addEventListener(
    "input",
    updatePreview
);

ageInput.addEventListener(
    "input",
    updatePreview
);

teamSelect.addEventListener(
    "change",
    updatePreview
);


function updatePreview(){

    const name =
        nameInput.value.trim();

    const team =
        teamSelect.value;

    document.getElementById(
        "previewName"
    ).textContent =
        name || "Tu nombre";

    document.getElementById(
        "previewTeam"
    ).textContent =
        team || "Selecciona un equipo";

}


/* =====================================================
   ESTADÍSTICA NORMAL
===================================================== */

function randomNormalStat(){

    return Math.floor(
        Math.random()*11
    ) + 1;

}


/* =====================================================
   GENERAR ESTADÍSTICAS
===================================================== */

function generateStats(){

    /*
       92% normal
       4% Los Ledesma
       4% El Gigante Herreño
    */

    const roll =
        Math.random()*100;


    if(roll < 4){

        player.trait =
            "Los Ledesma";

        player.stats.fuerza =
            Math.floor(Math.random()*6)+12;

        player.stats.tecnica =
            Math.floor(Math.random()*6)+12;

        player.stats.resistencia =
            Math.floor(Math.random()*6)+12;

        player.stats.velocidad =
            Math.floor(Math.random()*6)+12;

        player.stats.mentalidad =
            Math.floor(Math.random()*6)+12;

    }

    else if(roll < 8){

        player.trait =
            "El Gigante Herreño";

        /*
           EXACTAMENTE 40
        */

        player.stats.fuerza = 40;

        player.stats.tecnica =
            randomNormalStat();

        player.stats.resistencia =
            randomNormalStat();

        player.stats.velocidad =
            randomNormalStat();

        player.stats.mentalidad =
            randomNormalStat();

    }

    else{

        player.trait =
            "Normal";

        player.stats.fuerza =
            randomNormalStat();

        player.stats.tecnica =
            randomNormalStat();

        player.stats.resistencia =
            randomNormalStat();

        player.stats.velocidad =
            randomNormalStat();

        player.stats.mentalidad =
            randomNormalStat();

    }

    player.generated = true;

    renderPreviewStats();

}


/* =====================================================
   PREVIEW DE ESTADÍSTICAS
===================================================== */

function renderPreviewStats(){

    const container =
        document.getElementById(
            "previewStats"
        );

    const names = {

        fuerza:"💪 Fuerza",
        tecnica:"🥋 Técnica",
        resistencia:"❤️ Resistencia",
        velocidad:"⚡ Velocidad",
        mentalidad:"🧠 Mentalidad"

    };

    container.innerHTML = "";

    Object.keys(player.stats).forEach(
        function(stat){

            const value =
                player.stats[stat];

            const div =
                document.createElement("div");

            div.className = "stat";

            div.innerHTML = `

                <div class="stat-top">

                    <span>
                        ${names[stat]}
                    </span>

                    <strong>
                        ${value}
                    </strong>

                </div>

                <div class="bar">

                    <div
                        class="bar-fill"
                        style="width:${Math.min(value,100)}%">
                    </div>

                </div>

            `;

            container.appendChild(div);

        }
    );


    const trait =
        document.getElementById(
            "previewTrait"
        );

    if(player.trait !== "Normal"){

        trait.innerHTML = `
            <div class="trait">
                ✨ ${player.trait}
            </div>
        `;

    }
    else{

        trait.innerHTML = `
            <div
                style="
                text-align:center;
                opacity:.6;
                margin-top:15px;">
                Luchador normal
            </div>
        `;

    }

}


/* =====================================================
   GENERAR ESTADÍSTICAS
===================================================== */

document
.getElementById("generateButton")
.addEventListener(
    "click",
    function(){

        generateStats();

    }
);


/* =====================================================
   COMENZAR CARRERA
===================================================== */

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);


function startGame(){

    const name =
        nameInput.value.trim();

    const age =
        Number(ageInput.value);

    const island =
        islandSelect.value;

    const team =
        teamSelect.value;


    if(!name){

        alert(
            "Escribe el nombre de tu luchador."
        );

        return;
    }


    if(age < 12 || age > 18){

        alert(
            "La edad debe estar entre 12 y 18 años."
        );

        return;
    }


    if(!island){

        alert(
            "Selecciona una isla."
        );

        return;
    }


    if(!team){

        alert(
            "Selecciona un equipo."
        );

        return;
    }


    /*
       Si no se han generado manualmente,
       se generan automáticamente.
    */

    if(!player.generated){

        generateStats();

    }


    player.name = name;
    player.age = age;
    player.island = island;
    player.team = team;


    document
        .getElementById("creationScreen")
        .classList.add("hidden");


    document
        .getElementById("gameScreen")
        .classList.remove("hidden");


    updateGameUI();


    addNews(
        "🥋 " +
        player.name +
        " comienza su carrera como Cadete."
    );


    if(player.trait !== "Normal"){

        showModal(
            "✨ ¡Talento especial!",
            "Tu luchador tiene una característica especial: " +
            player.trait,
            function(){

                closeModal();

                nextDecision();

            }
        );

    }
    else{

        nextDecision();

    }

}


/* =====================================================
   ACTUALIZAR JUEGO
===================================================== */

function updateGameUI(){

    document.getElementById(
        "uiName"
    ).textContent =
        player.name;

    document.getElementById(
        "uiCategory"
    ).textContent =
        player.category;

    document.getElementById(
        "uiTeam"
    ).textContent =
        player.team;

    document.getElementById(
        "uiDecisions"
    ).textContent =
        player.decisions;


    renderGameStats();

}


/* =====================================================
   ESTADÍSTICAS DEL JUEGO
===================================================== */

function renderGameStats(){

    const container =
        document.getElementById("stats");

    const names = {

        fuerza:"💪 Fuerza",
        tecnica:"🥋 Técnica",
        resistencia:"❤️ Resistencia",
        velocidad:"⚡ Velocidad",
        mentalidad:"🧠 Mentalidad"

    };

    container.innerHTML = "";


    Object.keys(player.stats).forEach(
        function(stat){

            const value =
                player.stats[stat];

            const div =
                document.createElement("div");

            div.className = "stat";

            div.innerHTML = `

                <div class="stat-top">

                    <span>
                        ${names[stat]}
                    </span>

                    <strong>
                        ${value}
                    </strong>

                </div>

                <div class="bar">

                    <div
                        class="bar-fill"
                        style="width:${Math.min(value,100)}%">
                    </div>

                </div>

            `;

            container.appendChild(div);

        }
    );


    const trait =
        document.getElementById("trait");

    if(player.trait !== "Normal"){

        trait.innerHTML =
            `<div class="trait">
                ✨ ${player.trait}
             </div>`;

    }
    else{

        trait.innerHTML = "";

    }

}


/* =====================================================
   NOTICIAS
===================================================== */

function addNews(text){

    const list =
        document.getElementById(
            "newsList"
        );

    const item =
        document.createElement("div");

    item.className =
        "news-item";

    item.textContent =
        text;

    list.prepend(item);


    while(list.children.length > 5){

        list.removeChild(
            list.lastChild
        );

    }

}


/* =====================================================
   DECISIONES
===================================================== */

const decisions = [

    {
        title:"🏋️ Entrenamiento",
        text:"El entrenador prepara una sesión importante. ¿En qué quieres centrarte?",
        options:[
            {
                text:"💪 Entrenar fuerza",
                effects:{fuerza:2},
                result:"Has trabajado tu potencia y terminas la sesión con buenas sensaciones."
            },
            {
                text:"🥋 Trabajar técnica",
                effects:{tecnica:2},
                result:"Has repetido tus movimientos hasta perfeccionarlos."
            },
            {
                text:"❤️ Trabajar resistencia",
                effects:{resistencia:2},
                result:"Has completado una sesión exigente y tu resistencia mejora."
            }
        ]
    },

    {
        title:"🥋 Sesión técnica",
        text:"Tienes tiempo para mejorar un aspecto concreto de tu lucha.",
        options:[
            {
                text:"⚡ Trabajar velocidad",
                effects:{velocidad:2},
                result:"Tus movimientos son más rápidos."
            },
            {
                text:"🧠 Trabajar mentalidad",
                effects:{mentalidad:2},
                result:"Aprendes a mantener la cabeza fría."
            },
            {
                text:"🥋 Perfeccionar técnica",
                effects:{tecnica:3},
                result:"Tus movimientos empiezan a salir con mayor precisión."
            }
        ]
    },

    {

    }

/* =====================================================
   SIGUIENTE DECISIÓN
===================================================== */

function nextDecision(){

    if(player.careerOver){
        return;
    }


    /*
       CONVOCATORIA DESPUÉS DE 3 DECISIONES
    */

    if(
        player.decisions === 3 &&
        !player.seniorCallup
    ){

        showSeniorCallup();

        return;
    }


    /*
       COMPETICIÓN CADA 2 DECISIONES
       DESPUÉS DE LA CONVOCATORIA
    */

    if(
        player.seniorCallup &&
        player.decisions > 3 &&
        player.decisions % 2 === 0
    ){

        startFight();

        return;
    }


    showDecision();

}


/* =====================================================
   MOSTRAR DECISIÓN
===================================================== */

function showDecision(){

    const decision =
        decisions[
            Math.floor(
                Math.random() *
                decisions.length
            )
        ];


    document.getElementById(
        "eventTitle"
    ).textContent =
        decision.title;


    document.getElementById(
        "eventText"
    ).textContent =
        decision.text;


    const actions =
        document.getElementById(
            "actions"
        );

    actions.innerHTML = "";


    decision.options.forEach(
        function(option){

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "action-button";

            button.textContent =
                option.text;


            button.addEventListener(
                "click",
                function(){

                    applyEffects(
                        option.effects
                    );

                    player.decisions++;

                    updateGameUI();

                    showResult(
                        "📢 Resultado",
                        option.result,
                        nextDecision
                    );

                }
            );


            actions.appendChild(button);

        }
    );


    /*
       MÉTODO PROHIBIDO:
       SOLO 2% DE PROBABILIDAD
       Y ES UNA OPCIÓN, NO OBLIGATORIO.
    */

    if(Math.random() < 0.02){

        const forbidden =
            document.createElement(
                "button"
            );

        forbidden.type = "button";

        forbidden.className =
            "action-button danger";

        forbidden.textContent =
            "⚠️ Utilizar un método prohibido";


        forbidden.addEventListener(
            "click",
            forbiddenChoice
        );


        actions.appendChild(
            forbidden
        );

    }

}


/* =====================================================
   EFECTOS
===================================================== */

function applyEffects(effects){

    Object.keys(effects).forEach(
        function(stat){

            player.stats[stat] +=
                effects[stat];


            player.stats[stat] =
                Math.max(
                    1,
                    Math.min(
                        100,
                        player.stats[stat]
                    )
                );

        }
    );


    updateGameUI();

}


/* =====================================================
   RESULTADO
===================================================== */

function showResult(
    title,
    text,
    callback
){

    document.getElementById(
        "eventTitle"
    ).textContent =
        title;


    document.getElementById(
        "eventText"
    ).textContent =
        text;


    const actions =
        document.getElementById(
            "actions"
        );

    actions.innerHTML = "";


    const button =
        document.createElement(
            "button"
        );

    button.type = "button";

    button.className =
        "primary";

    button.textContent =
        "➡️ CONTINUAR";


    button.addEventListener(
        "click",
        callback
    );


    actions.appendChild(
        button
    );

}


/* =====================================================
   CONVOCATORIA SENIOR
===================================================== */

function showSeniorCallup(){

    showModal(
        "🥇 ¡CONVOCATORIA SENIOR!",
        "El equipo Senior quiere que tengas la oportunidad de luchar con ellos. Seguirás siendo oficialmente Cadete.",
        function(){

            player.seniorCallup =
                true;

            /*
               MUY IMPORTANTE:
               SIGUE SIENDO CADETE.
            */

            player.category =
                "Cadete";


            closeModal();


            addNews(
                "🥇 " +
                player.name +
                " ha sido convocado para luchar con Senior."
            );


            showResult(
                "🔥 Nueva oportunidad",
                "Has aceptado la convocatoria. Sigues siendo Cadete, pero ahora puedes disputar luchadas con Senior.",
                nextDecision
            );

        }
    );

}


/* =====================================================
   OPONENTES
===================================================== */

const opponents = [

    "un rival muy técnico",
    "un luchador conocido por su fuerza",
    "un rival muy rápido",
    "un luchador muy resistente",
    "un rival con mucha experiencia",
    "un luchador joven que está destacando"

];


/* =====================================================
   COMBATE
===================================================== */

function startFight(){

    player.fights++;


    const opponent =
        opponents[
            Math.floor(
                Math.random() *
                opponents.length
            )
        ];


    document.getElementById(
        "eventTitle"
    ).textContent =
        "🏆 DÍA DE COMPETICIÓN";


    document.getElementById(
        "eventText"
    ).innerHTML = `

        <div class="fight">

            <div>
                Tu oponente en esta agarrada es...
            </div>

            <div class="opponent">
                ${opponent}
            </div>

            <div>
                ¿Qué vas a hacer?
            </div>

        </div>

    `;


    const actions =
        document.getElementById(
            "actions"
        );

    actions.innerHTML = "";


    const choices = [

        {
            text:"🥋 Buscar una pardelera",
            stat:"tecnica"
        },

        {
            text:"💪 Luchar con potencia",
            stat:"fuerza"
        },

        {
            text:"🧠 Defender y esperar un error",
            stat:"mentalidad"
        },

        {
            text:"⚡ Atacar rápido",
            stat:"velocidad"
        }

    ];


    choices.forEach(
        function(choice){

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "action-button";

            button.textContent =
                choice.text;


            button.addEventListener(
                "click",
                function(){

                    resolveFight(
                        choice
                    );

                }
            );


            actions.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   RESULTADO COMBATE
===================================================== */

function resolveFight(choice){

    const value =
        player.stats[
            choice.stat
        ];


    let chance =
        .35 +
        (value / 100) * .45;


    chance =
        Math.min(
            .85,
            chance
        );


    const won =
        Math.random() < chance;


    if(won){

        player.stats.mentalidad =
            Math.min(
                100,
                player.stats.mentalidad + 1
            );


        addNews(
            "🏆 " +
            player.name +
            " consigue una victoria."
        );


        showResult(
            "🔥 ¡VICTORIA!",
            "Has ganado la agarrada. Tu actuación te da confianza.",
            nextDecision
        );

    }

    else{

        player.stats.mentalidad =
            Math.max(
                1,
                player.stats.mentalidad - 1
            );


        addNews(
            "📢 " +
            player.name +
            " ha sufrido una derrota."
        );


        showResult(
            "❌ DERROTA",
            "Esta vez el rival consiguió imponerse. Toca aprender y seguir trabajando.",
            nextDecision
        );

    }


    updateGameUI();

}


/* =====================================================
   MÉTODO PROHIBIDO
===================================================== */

function forbiddenChoice(){

    showResult(
        "⚠️ Una decisión peligrosa",
        "Te han ofrecido utilizar un método prohibido para obtener ventaja. Puedes rechazarlo y continuar normalmente.",
        function(){

            const actions =
                document.getElementById(
                    "actions"
                );

            actions.innerHTML = "";


            const risk =
                document.createElement(
                    "button"
                );

            risk.className =
                "action-button danger";

            risk.textContent =
                "⚠️ Aceptar el riesgo";


            risk.addEventListener(
                "click",
                forbiddenRoulette
            );


            const refuse =
                document.createElement(
                    "button"
                );

            refuse.className =
                "action-button";

            refuse.textContent =
                "❌ Rechazar";


            refuse.addEventListener(
                "click",
                function(){

                    showResult(
                        "💪 Has elegido el camino limpio",
                        "Rechazas la propuesta y continúas tu carrera.",
                        nextDecision
                    );

                }
            );


            actions.appendChild(risk);
            actions.appendChild(refuse);

        }
    );

}


/* =====================================================
   RULETA
===================================================== */

function forbiddenRoulette(){

    showModal(
        "🎰 RULETA",
        "Has decidido arriesgar tu carrera. La ruleta determinará el resultado.",
        function(){

            closeModal();


            const actions =
                document.getElementById(
                    "actions"
                );


            actions.innerHTML = `

                <button
                    class="primary"
                    id="rouletteButton"
                    disabled>

                    🎰 GIRANDO...

                </button>

            `;


            const button =
                document.getElementById(
                    "rouletteButton"
                );


            let count = 0;


            const interval =
                setInterval(
                    function(){

                        button.textContent =
                            "🎰 " +
                            Math.floor(
                                Math.random()*100
                            ) +
                            "%";


                        count++;


                        if(count >= 15){

                            clearInterval(
                                interval
                            );


                            /*
                               20% FUNCIONA
                               80% TE DESCUBREN
                            */

                            const works =
                                Math.random() < .20;


                            if(works){

                                player.stats.fuerza =
                                    Math.min(
                                        100,
                                        player.stats.fuerza + 20
                                    );


                                updateGameUI();


                                showResult(
                                    "⚠️ Ha funcionado",
                                    "Has conseguido la ventaja, pero has puesto tu carrera en riesgo.",
                                    nextDecision
                                );

                            }

                            else{

                                endCareer();

                            }

                        }

                    },
                    120
                );

        }
    );

}


/* =====================================================
   FIN DE CARRERA
===================================================== */

function endCareer(){

    player.careerOver =
        true;


    showModal(
        "🚨 CARRERA TERMINADA",
        "Te han descubierto utilizando un método prohibido. Tu carrera deportiva termina aquí.",
        function(){

            location.reload();

        }
    );

}


/* =====================================================
   MODAL
===================================================== */

function showModal(
    title,
    text,
    callback
){

    document
        .getElementById("modal")
        .classList
        .remove("hidden");


    document
        .getElementById("modalTitle")
        .textContent =
        title;


    document
        .getElementById("modalText")
        .textContent =
        text;


    document
        .getElementById("modalButton")
        .onclick =
        callback;

}


function closeModal(){

    document
        .getElementById("modal")
        .classList
        .add("hidden");

}

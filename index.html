<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camino al Terrero</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    min-height: 100vh;
    background:
        radial-gradient(circle at 10% 10%, #ff3158 0%, transparent 30%),
        radial-gradient(circle at 90% 90%, #315cff 0%, transparent 30%),
        linear-gradient(135deg, #11142b, #292052);
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================
   INICIO
========================= */

#startScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.start-box {
    width: 100%;
    max-width: 600px;
    padding: 35px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,.10);
    border: 2px solid rgba(255,255,255,.18);
    box-shadow: 0 20px 70px rgba(0,0,0,.45);
    backdrop-filter: blur(15px);
}

.logo {
    font-size: clamp(38px, 8vw, 70px);
    font-weight: 900;
    line-height: .95;
    text-transform: uppercase;
    text-shadow: 4px 4px #000;
    margin-bottom: 12px;
}

.start-box p {
    opacity: .8;
    margin-bottom: 30px;
}

.start-box input,
.start-box select {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 12px 0;
    border: 0;
    border-radius: 14px;
    outline: none;
}

.primary {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    border: 0;
    border-radius: 15px;
    color: white;
    font-weight: 900;
    background: linear-gradient(135deg, #ff3158, #ff7b25);
    transition: .2s;
}

.primary:hover {
    transform: scale(1.03);
}

/* =========================
   JUEGO
========================= */

#gameScreen {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.header {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.header-card {
    padding: 14px;
    text-align: center;
    border-radius: 16px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.15);
}

.header-card small {
    opacity: .65;
}

.header-card strong {
    display: block;
    margin-top: 5px;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 310px;
    gap: 15px;
}

.panel {
    padding: 25px;
    border-radius: 25px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

#eventTitle {
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 12px;
}

#eventText {
    line-height: 1.6;
    margin-bottom: 22px;
    opacity: .9;
}

/* =========================
   BOTONES DE ACCIÓN
========================= */

#actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.action-button {
    width: 100%;
    padding: 17px;
    text-align: left;
    border: 0;
    border-radius: 17px;
    color: white;
    font-weight: 700;
    background: linear-gradient(135deg, #3949ab, #7b1fa2);
    box-shadow: 0 6px 15px rgba(0,0,0,.2);
    transition: .2s;
}

.action-button:hover {
    transform: translateX(7px);
    filter: brightness(1.2);
}

.action-button:active {
    transform: scale(.98);
}

.danger {
    background: linear-gradient(135deg, #8b0000, #3b1010);
}

/* =========================
   ESTADÍSTICAS
========================= */

.stats-title {
    margin-top: 0;
}

.stat {
    margin: 16px 0;
}

.stat-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
}

.bar {
    height: 11px;
    overflow: hidden;
    border-radius: 20px;
    background: rgba(255,255,255,.15);
}

.bar-fill {
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #00d4ff, #7c4dff);
    transition: width .5s;
}

.trait {
    padding: 12px;
    margin-top: 18px;
    border-radius: 13px;
    text-align: center;
    font-weight: bold;
    background: linear-gradient(135deg,#ff9800,#e91e63);
}

/* =========================
   NOTICIAS
========================= */

.news {
    margin-top: 15px;
}

.news h3 {
    margin-top: 0;
}

.news-item {
    padding: 10px;
    margin: 8px 0;
    border-radius: 12px;
    font-size: 13px;
    background: rgba(0,0,0,.20);
}

/* =========================
   COMBATE
========================= */

.fight {
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 20px;
    text-align: center;
    background: linear-gradient(135deg,#7b1fa2,#311b92);
}

.opponent {
    margin: 12px 0;
    font-size: 25px;
    font-weight: 900;
}

/* =========================
   MODAL
========================= */

#modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: rgba(0,0,0,.78);
}

.modal-box {
    width: 100%;
    max-width: 600px;
    padding: 30px;
    text-align: center;
    border-radius: 25px;
    background: linear-gradient(145deg,#29294d,#16162c);
    border: 2px solid rgba(255,255,255,.2);
    box-shadow: 0 25px 80px rgba(0,0,0,.6);
    animation: appear .3s ease;
}

.modal-box h2 {
    font-size: 30px;
}

.modal-box p {
    line-height: 1.6;
    opacity: .9;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.75);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-width: 800px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .header {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 450px) {

    #gameScreen {
        padding: 10px;
    }

    .panel {
        padding: 18px;
    }

    #eventTitle {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     PANTALLA INICIAL
===================================================== -->

<section id="startScreen">

    <div class="start-box">

        <div class="logo">
            Camino al Terrero
        </div>

        <p>
            Construye tu carrera desde Cadete hasta la élite.
        </p>

        <input
            id="nameInput"
            type="text"
            maxlength="25"
            placeholder="Tu nombre"
        >

        <select id="islandSelect">
            <option value="">Selecciona tu isla</option>
            <option value="Fuerteventura">Fuerteventura</option>
            <option value="Gran Canaria">Gran Canaria</option>
            <option value="Tenerife">Tenerife</option>
            <option value="La Palma">La Palma</option>
        </select>

        <select id="teamSelect">
            <option value="">Primero selecciona una isla</option>
        </select>

        <button
            class="primary"
            id="startButton">
            🥋 COMENZAR CARRERA
        </button>

    </div>

</section>


<!-- =====================================================
     PANTALLA DEL JUEGO
===================================================== -->

<section id="gameScreen" class="hidden">

    <div class="header">

        <div class="header-card">
            <small>Luchador</small>
            <strong id="uiName">---</strong>
        </div>

        <div class="header-card">
            <small>Categoría</small>
            <strong id="uiCategory">Cadete</strong>
        </div>

        <div class="header-card">
            <small>Equipo</small>
            <strong id="uiTeam">---</strong>
        </div>

        <div class="header-card">
            <small>Decisiones</small>
            <strong id="uiDecisions">0</strong>
        </div>

    </div>


    <div class="layout">

        <main class="panel">

            <div id="eventTitle">
                Tu carrera comienza
            </div>

            <div id="eventText">
                Prepárate para tu primer día.
            </div>

            <!-- AQUÍ SE CREAN LOS BOTONES -->
            <div id="actions"></div>

        </main>


        <aside>

            <div class="panel">

                <h2 class="stats-title">
                    📊 Estadísticas
                </h2>

                <div id="stats"></div>

                <div id="trait"></div>

            </div>


            <div class="panel news">

                <h3>📰 Noticias de última hora</h3>

                <div id="newsList"></div>

            </div>

        </aside>

    </div>

</section>


<!-- =====================================================
     MODAL
===================================================== -->

<div id="modal" class="hidden">

    <div class="modal-box">

        <h2 id="modalTitle"></h2>

        <p id="modalText"></p>

        <button
            class="primary"
            id="modalButton">
            CONTINUAR
        </button>

    </div>

</div>


<script>

/* =====================================================
   EQUIPOS
===================================================== */

const teams = {

    "Fuerteventura": [
        "Club de lucha Unión Antigua ⚪🟢",
        "Rosario Club de Lucha 🔵🔴",
        "Club de lucha Unión Tetir 🔵⚪"
    ],

    "Gran Canaria": [
        "Club de lucha Adargoma ⚪🔴",
        "Club de lucha Castillo del Romeral 🟡🔵",
        "Club de lucha Castro Morales ⚫⚪"
    ],

    "Tenerife": [
        "Club de lucha Chimbesque 🟡🔵",
        "Club de lucha Campitos 🟢⚪",
        "Club de lucha Rosario Valle Guerra ⚪🔴"
    ],

    "La Palma": [
        "Club de lucha Aridane 🟠🔵",
        "Club de lucha Candelaria 🔵⚪",
        "Club de lucha Bediesta ⚫🟢"
    ]

};


/* =====================================================
   JUGADOR
===================================================== */

const player = {

    name: "",
    island: "",
    team: "",

    category: "Cadete",

    decisions: 0,
    fights: 0,

    seniorCallup: false,
    careerOver: false,

    trait: "Normal",

    stats: {

        fuerza: 0,
        tecnica: 0,
        resistencia: 0,
        velocidad: 0,
        mentalidad: 0

    }

};


/* =====================================================
   SELECTOR DE EQUIPOS
===================================================== */

document
.getElementById("islandSelect")
.addEventListener("change", function () {

    const island = this.value;
    const teamSelect =
        document.getElementById("teamSelect");

    teamSelect.innerHTML = "";

    if (!island) {

        teamSelect.innerHTML =
            '<option value="">Selecciona primero una isla</option>';

        return;
    }

    teams[island].forEach(function (team) {

        const option =
            document.createElement("option");

        option.value = team;
        option.textContent = team;

        teamSelect.appendChild(option);

    });

});


/* =====================================================
   ESTADÍSTICAS INICIALES
===================================================== */

function normalStat() {

    return Math.floor(Math.random() * 11) + 1;

}


function generateStats() {

    const roll = Math.random() * 100;

    /*
       92% NORMAL
       4% LOS LEDESMA
       4% GIGANTE HERREÑO
    */

    if (roll < 4) {

        player.trait = "Los Ledesma";

        player.stats.fuerza =
            Math.floor(Math.random() * 6) + 12;

        player.stats.tecnica =
            Math.floor(Math.random() * 6) + 12;

        player.stats.resistencia =
            Math.floor(Math.random() * 6) + 12;

        player.stats.velocidad =
            Math.floor(Math.random() * 6) + 12;

        player.stats.mentalidad =
            Math.floor(Math.random() * 6) + 12;

    }

    else if (roll < 8) {

        player.trait = "El Gigante Herreño";

        /*
           EXACTAMENTE 40 DE FUERZA
        */

        player.stats.fuerza = 40;

        player.stats.tecnica = normalStat();
        player.stats.resistencia = normalStat();
        player.stats.velocidad = normalStat();
        player.stats.mentalidad = normalStat();

    }

    else {

        player.trait = "Normal";

        player.stats.fuerza = normalStat();
        player.stats.tecnica = normalStat();
        player.stats.resistencia = normalStat();
        player.stats.velocidad = normalStat();
        player.stats.mentalidad = normalStat();

    }

}


/* =====================================================
   BOTÓN COMENZAR
===================================================== */

document
.getElementById("startButton")
.addEventListener("click", startGame);


function startGame() {

    const name =
        document.getElementById("nameInput")
        .value.trim();

    const island =
        document.getElementById("islandSelect")
        .value;

    const team =
        document.getElementById("teamSelect")
        .value;

    if (!name) {

        alert("Escribe tu nombre.");

        return;
    }

    if (!island) {

        alert("Selecciona una isla.");

        return;
    }

    if (!team) {

        alert("Selecciona un equipo.");

        return;
    }

    player.name = name;
    player.island = island;
    player.team = team;

    generateStats();

    document
        .getElementById("startScreen")
        .classList.add("hidden");

    document
        .getElementById("gameScreen")
        .classList.remove("hidden");

    updateUI();

    addNews(
        "🥋 " + player.name +
        " comienza su carrera como Cadete."
    );

    if (player.trait !== "Normal") {

        showModal(
            "✨ Característica especial",
            "Tu carrera comienza con: " +
            player.trait,
            function () {
                nextDecision();
            }
        );

    } else {

        nextDecision();

    }

}


/* =====================================================
   ACTUALIZAR INTERFAZ
===================================================== */

function updateUI() {

    document.getElementById("uiName").textContent =
        player.name;

    document.getElementById("uiCategory").textContent =
        player.category;

    document.getElementById("uiTeam").textContent =
        player.team;

    document.getElementById("uiDecisions").textContent =
        player.decisions;


    const stats =
        document.getElementById("stats");

    stats.innerHTML = "";

    const names = {

        fuerza: "💪 Fuerza",
        tecnica: "🥋 Técnica",
        resistencia: "❤️ Resistencia",
        velocidad: "⚡ Velocidad",
        mentalidad: "🧠 Mentalidad"

    };

    for (const stat in player.stats) {

        const value = player.stats[stat];

        const div =
            document.createElement("div");

        div.className = "stat";

        div.innerHTML = `
            <div class="stat-top">
                <span>${names[stat]}</span>
                <strong>${value}</strong>
            </div>

            <div class="bar">
                <div
                    class="bar-fill"
                    style="width:${Math.min(value,100)}%">
                </div>
            </div>
        `;

        stats.appendChild(div);

    }


    const trait =
        document.getElementById("trait");

    if (player.trait !== "Normal") {

        trait.innerHTML =
            `<div class="trait">✨ ${player.trait}</div>`;

    } else {

        trait.innerHTML = "";

    }

}


/* =====================================================
   NOTICIAS
===================================================== */

function addNews(text) {

    const list =
        document.getElementById("newsList");

    const item =
        document.createElement("div");

    item.className = "news-item";

    item.textContent = text;

    list.prepend(item);

    while (list.children.length > 5) {

        list.removeChild(list.lastChild);

    }

}


/* =====================================================
   DECISIONES
===================================================== */

const decisions = [

    {
        title: "🏋️ Entrenamiento",
        text: "Hoy tienes una sesión importante. ¿Cómo quieres afrontarla?",
        options: [
            {
                text: "💪 Entrenar fuerza",
                effects: { fuerza: 2 },
                result: "Has trabajado duro tu potencia."
            },
            {
                text: "🥋 Trabajar técnica",
                effects: { tecnica: 2 },
                result: "Has perfeccionado tus movimientos."
            },
            {
                text: "❤️ Trabajar resistencia",
                effects: { resistencia: 2 },
                result: "Has conseguido completar una sesión muy exigente."
            }
        ]
    },

    {
        title: "🥋 Sesión técnica",
        text: "El entrenador quiere que mejores un aspecto concreto.",
        options: [
            {
                text: "⚡ Velocidad",
                effects: { velocidad: 2 },
                result: "Tus movimientos son cada vez más rápidos."
            },
            {
                text: "🧠 Concentración",
                effects: { mentalidad: 2 },
                result: "Aprendes a mantener la cabeza fría."
            },
            {
                text: "🥋 Técnica",
                effects: { tecnica: 3 },
                result: "Repites los movimientos hasta perfeccionarlos."
            }
        ]
    },

    {
        title: "🔥 Entrenamiento intenso",
        text: "La sesión está siendo mucho más dura de lo habitual.",
        options: [
            {
                text: "🔥 Aguantar hasta el final",
                effects: { resistencia: 3 },
                result: "No te rindes y terminas la sesión."
            },
            {
                text: "💪 Darlo todo en potencia",
                effects: { fuerza: 3 },
                result: "Tu potencia mejora después de la sesión."
            },
            {
                text: "🧠 Escuchar al entrenador",
                effects: { mentalidad: 2 },
                result: "Aprendes a controlar mejor tus esfuerzos."
            }
        ]
    },

    {
        title: "🎯 Preparación",
        text: "Se acerca una competición y tienes que decidir cómo prepararte.",
        options: [
            {
                text: "🥋 Practicar movimientos",
                effects: { tecnica: 2 },
                result: "Repasas tus movimientos una y otra vez."
            },
            {
                text: "⚡ Trabajar explosividad",
                effects: { velocidad: 2 },
                result: "Tus arrancadas mejoran."
            },
            {
                text: "🧠 Preparar una estrategia",
                effects: { mentalidad: 3 },
                result: "Llegas con una estrategia clara."
            }
        ]
    },

    {
        title: "🏃 Día de entrenamiento",
        text: "Tienes varias opciones para aprovechar el día.",
        options: [
            {
                text: "🏃 Carrera y resistencia",
                effects: { resistencia: 2 },
                result: "Tu físico aguanta cada vez más."
            },
            {
                text: "💪 Trabajo físico",
                effects: { fuerza: 2 },
                result: "Sales con mejores sensaciones físicas."
            },
            {
                text: "🥋 Técnica individual",
                effects: { tecnica: 2 },
                result: "Tu técnica sigue evolucionando."
            }
        ]
    }

];


/* =====================================================
   SIGUIENTE DECISIÓN
===================================================== */

function nextDecision() {

    if (player.careerOver) return;

    /*
       La convocatoria aparece EXACTAMENTE
       después de 3 decisiones.
    */

    if (
        player.decisions === 3 &&
        !player.seniorCallup
    ) {

        showSeniorCallup();

        return;
    }


    /*
       Después de aceptar Senior,
       cada 2 decisiones hay competición.
    */

    if (
        player.seniorCallup &&
        player.decisions > 3 &&
        player.decisions % 2 === 0
    ) {

        startFight();

        return;
    }


    showDecision();

}


/* =====================================================
   MOSTRAR DECISIÓN
===================================================== */

function showDecision() {

    const decision =
        decisions[
            Math.floor(
                Math.random() * decisions.length
            )
        ];


    document.getElementById("eventTitle").textContent =
        decision.title;

    document.getElementById("eventText").textContent =
        decision.text;


    const actions =
        document.getElementById("actions");

    /*
       AQUÍ SE BORRAN LOS BOTONES ANTERIORES
       Y SE CREAN LOS NUEVOS.
    */

    actions.innerHTML = "";


    decision.options.forEach(function (option) {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "action-button";

        button.textContent =
            option.text;

        button.addEventListener("click", function () {

            applyEffects(option.effects);

            player.decisions++;

            updateUI();

            showResult(
                "📢 Resultado",
                option.result,
                function () {
                    nextDecision();
                }
            );

        });

        actions.appendChild(button);

    });


    /*
       MÉTODO PROHIBIDO:
       2% DE PROBABILIDAD DE APARECER
       COMO UNA OPCIÓN MÁS.
    */

    if (Math.random() < 0.02) {

        const forbidden =
            document.createElement("button");

        forbidden.type = "button";

        forbidden.className =
            "action-button danger";

        forbidden.textContent =
            "⚠️ Hacer trampa";

        forbidden.addEventListener(
            "click",
            forbiddenChoice
        );

        actions.appendChild(forbidden);

    }

}


/* =====================================================
   APLICAR ESTADÍSTICAS
===================================================== */

function applyEffects(effects) {

    for (const stat in effects) {

        player.stats[stat] += effects[stat];

        player.stats[stat] =
            Math.max(
                1,
                Math.min(
                    100,
                    player.stats[stat]
                )
            );

    }

    updateUI();

}


/* =====================================================
   RESULTADO DE DECISIÓN
===================================================== */

function showResult(title, text, callback) {

    document.getElementById("eventTitle").textContent =
        title;

    document.getElementById("eventText").textContent =
        text;

    const actions =
        document.getElementById("actions");

    actions.innerHTML = "";

    const button =
        document.createElement("button");

    button.type = "button";

    button.className = "primary";

    button.textContent =
        "➡️ CONTINUAR";

    button.addEventListener(
        "click",
        callback
    );

    actions.appendChild(button);

}


/* =====================================================
   CONVOCATORIA SENIOR
===================================================== */

function showSeniorCallup() {

    showModal(
        "🥇 ¡CONVOCADO PARA SENIOR!",
        "El entrenador quiere que tengas la oportunidad de luchar con el equipo Senior. Si aceptas, seguirás siendo oficialmente Cadete, pero podrás disputar luchadas Senior.",
        acceptSenior
    );

}


function acceptSenior() {

    player.seniorCallup = true;

    /*
       IMPORTANTE:
       NO CAMBIAMOS LA CATEGORÍA.
    */

    player.category = "Cadete";

    closeModal();

    addNews(
        "🥇 " +
        player.name +
        " ha sido convocado para luchar con Senior."
    );

    showResult(
        "🔥 Nueva oportunidad",
        "Has aceptado la convocatoria. Sigues siendo Cadete, pero ahora puedes luchar también con Senior.",
        nextDecision
    );

}


/* =====================================================
   COMBATES
===================================================== */

const opponents = [
    "un rival muy técnico",
    "un luchador conocido por su fuerza",
    "un rival muy rápido",
    "un luchador muy resistente",
    "un rival con mucha experiencia",
    "un luchador joven que está destacando"
];


function startFight() {

    player.fights++;

    const opponent =
        opponents[
            Math.floor(
                Math.random() * opponents.length
            )
        ];


    document.getElementById("eventTitle").textContent =
        "🏆 DÍA DE COMPETICIÓN";

    document.getElementById("eventText").innerHTML = `
        <div class="fight">
            <div>Tu oponente en esta agarrada es...</div>
            <div class="opponent">${opponent}</div>
            <div>¿Qué vas a hacer?</div>
        </div>
    `;


    const actions =
        document.getElementById("actions");

    actions.innerHTML = "";


    const fightOptions = [

        {
            text: "🥋 Buscar una pardelera",
            stat: "tecnica"
        },

        {
            text: "💪 Luchar con potencia",
            stat: "fuerza"
        },

        {
            text: "🧠 Defender y esperar un error",
            stat: "mentalidad"
        },

        {
            text: "⚡ Atacar rápido",
            stat: "velocidad"
        }

    ];


    fightOptions.forEach(function (choice) {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "action-button";

        button.textContent =
            choice.text;

        button.addEventListener(
            "click",
            function () {

                resolveFight(choice);

            }
        );

        actions.appendChild(button);

    });

}


/* =====================================================
   RESOLVER LUCHA
===================================================== */

function resolveFight(choice) {

    const value =
        player.stats[choice.stat];

    /*
       La estadística influye,
       pero nunca garantiza la victoria.
    */

    let chance =
        0.35 + (value / 100) * 0.45;

    chance =
        Math.min(.85, chance);


    const won =
        Math.random() < chance;


    if (won) {

        player.stats.mentalidad =
            Math.min(
                100,
                player.stats.mentalidad + 1
            );

        addNews(
            "🏆 " +
            player.name +
            " consigue una victoria."
        );

        showResult(
            "🔥 ¡VICTORIA!",
            "Has ganado la agarrada. Tu actuación te da confianza para la próxima.",
            nextDecision
        );

    } else {

        player.stats.mentalidad =
            Math.max(
                1,
                player.stats.mentalidad - 1
            );

        addNews(
            "📢 " +
            player.name +
            " ha sufrido una derrota."
        );

        showResult(
            "❌ DERROTA",
            "Esta vez el rival consiguió imponerse. Toca aprender y seguir trabajando.",
            nextDecision
        );

    }

    updateUI();

}


/* =====================================================
   MÉTODO PROHIBIDO
===================================================== */

function forbiddenChoice() {

    showResult(
        "⚠️ Una decisión peligrosa",
        "Te han ofrecido una forma de conseguir una ventaja haciendo trampa. Puedes rechazarla y continuar tu carrera normalmente, o arriesgarte.",
        function () {

            const actions =
                document.getElementById("actions");

            actions.innerHTML = "";


            const risk =
                document.createElement("button");

            risk.className =
                "action-button danger";

            risk.textContent =
                "⚠️ Aceptar el riesgo";

            risk.addEventListener(
                "click",
                forbiddenRoulette
            );


            const refuse =
                document.createElement("button");

            refuse.className =
                "action-button";

            refuse.textContent =
                "❌ Rechazar";

            refuse.addEventListener(
                "click",
                function () {

                    showResult(
                        "💪 Has elegido el camino limpio",
                        "Decides continuar tu carrera sin hacer trampas.",
                        nextDecision
                    );

                }
            );


            actions.appendChild(risk);
            actions.appendChild(refuse);

        }
    );

}


/* =====================================================
   RULETA DEL MÉTODO PROHIBIDO
===================================================== */

function forbiddenRoulette() {

    showModal(
        "🎰 RULETA",
        "Has decidido arriesgar tu carrera. La ruleta determinará el resultado.",
        function () {

            closeModal();

            let count = 0;

            const actions =
                document.getElementById("actions");

            actions.innerHTML = `
                <button
                    class="primary"
                    id="rouletteButton"
                    disabled>
                    🎰 GIRANDO...
                </button>
            `;

            const rouletteButton =
                document.getElementById("rouletteButton");


            const interval =
                setInterval(function () {

                    rouletteButton.textContent =
                        "🎰 " +
                        Math.floor(
                            Math.random() * 100
                        ) +
                        "%";

                    count++;


                    if (count >= 15) {

                        clearInterval(interval);

                        /*
                           80% descubierto
                           20% funciona
                        */

                        const works =
                            Math.random() < 0.20;


                        if (works) {

                            player.stats.fuerza =
                                Math.min(
                                    100,
                                    player.stats.fuerza + 20
                                );

                            updateUI();

                            showResult(
                                "⚠️ Ha funcionado",
                                "Has obtenido una ventaja, pero ahora tendrás que vivir con el riesgo de haber hecho trampa.",
                                nextDecision
                            );

                        } else {

                            endCareer();

                        }

                    }

                }, 120);

        }
    );

}


/* =====================================================
   FIN DE CARRERA
===================================================== */

function endCareer() {

    player.careerOver = true;

    showModal(
        "🚨 CARRERA TERMINADA",
        "Te han descubierto utilizando un método prohibido. Tu carrera deportiva termina aquí.",
        function () {

            location.reload();

        }
    );

}


/* =====================================================
   MODALES
===================================================== */

function showModal(title, text, callback) {

    document
        .getElementById("modal")
        .classList.remove("hidden");

    document
        .getElementById("modalTitle")
        .textContent = title;

    document
        .getElementById("modalText")
        .textContent = text;


    const button =
        document.getElementById("modalButton");

    button.onclick = callback;

}


function closeModal() {

    document
        .getElementById("modal")
        .classList.add("hidden");

}


/* =====================================================
   NOTICIAS AUTOMÁTICAS
===================================================== */

const automaticNews = [

    "📰 Los equipos ya preparan la próxima jornada.",
    "📰 La afición espera con ganas la siguiente luchada.",
    "📰 Los entrenadores estudian nuevas estrategias.",
    "📰 Se acerca una jornada importante.",
    "📰 Varios luchadores jóvenes están destacando.",
    "📰 Los terreros empiezan a llenarse.",
    "📰 La temporada continúa avanzando."

];


setInterval(function () {

    if (
        player.name &&
        !player.careerOver
    ) {

        const text =
            automaticNews[
                Math.floor(
                    Math.random() *
                    automaticNews.length
                )
            ];

        addNews(text);

    }

}, 30000);

</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camino al Terrero</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #ff4d6d, transparent 35%),
        radial-gradient(circle at bottom right, #4d7cff, transparent 35%),
        linear-gradient(135deg, #15152b, #25254a);
    color: white;
}

button {
    font-family: inherit;
}

.hidden {
    display: none !important;
}

/* MENÚ */

.screen {
    min-height: 100vh;
    padding: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.menu {
    width: 100%;
    max-width: 900px;
    text-align: center;
}

.logo {
    font-size: clamp(42px, 8vw, 80px);
    font-weight: 900;
    text-transform: uppercase;
    text-shadow: 4px 4px 0 #000;
    margin-bottom: 10px;
}

.subtitle {
    opacity: .8;
    margin-bottom: 35px;
}

.card {
    background: rgba(255,255,255,.10);
    border: 2px solid rgba(255,255,255,.18);
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
    backdrop-filter: blur(12px);
}

input, select {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    margin: 8px 0;
    font-size: 16px;
}

.main-btn {
    border: none;
    border-radius: 16px;
    padding: 15px 25px;
    margin-top: 15px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg,#ff416c,#ff4b2b);
    transition: .2s;
}

.main-btn:hover {
    transform: translateY(-3px) scale(1.02);
}

/* JUEGO */

.game {
    max-width: 1100px;
    width: 100%;
    margin: auto;
    padding: 15px;
}

.topbar {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.info {
    background: rgba(255,255,255,.11);
    border-radius: 15px;
    padding: 13px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.15);
}

.info small {
    opacity: .65;
}

.info strong {
    display: block;
    margin-top: 4px;
}

.game-grid {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 15px;
}

.panel {
    background: rgba(255,255,255,.10);
    border-radius: 22px;
    padding: 22px;
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 15px 35px rgba(0,0,0,.25);
}

.event-title {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 10px;
}

.event-text {
    line-height: 1.6;
    opacity: .9;
    margin-bottom: 20px;
}

.options {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.option {
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 16px;
    text-align: left;
    color: white;
    background: linear-gradient(135deg,#3949ab,#6a1b9a);
    cursor: pointer;
    transition: .2s;
    font-size: 15px;
}

.option:hover {
    transform: translateX(6px);
    filter: brightness(1.15);
}

.option.danger {
    background: linear-gradient(135deg,#8e0e00,#1f1f1f);
}

/* ESTADÍSTICAS */

.stat {
    margin: 13px 0;
}

.stat-head {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
}

.bar {
    height: 11px;
    background: rgba(255,255,255,.15);
    border-radius: 20px;
    overflow: hidden;
}

.fill {
    height: 100%;
    width: 0%;
    border-radius: 20px;
    transition: width .6s ease;
    background: linear-gradient(90deg,#00e5ff,#7c4dff);
}

.news {
    margin-top: 15px;
}

.news h3 {
    margin-bottom: 10px;
}

.news-item {
    background: rgba(0,0,0,.18);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 8px;
    font-size: 13px;
}

.special {
    margin-top: 15px;
    padding: 12px;
    border-radius: 13px;
    background: linear-gradient(135deg,#ff9800,#e91e63);
    font-weight: bold;
}

/* MODAL */

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal {
    width: 100%;
    max-width: 600px;
    background: linear-gradient(145deg,#28284c,#17172e);
    border: 2px solid rgba(255,255,255,.2);
    border-radius: 25px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 25px 70px rgba(0,0,0,.6);
    animation: pop .35s ease;
}

.modal h2 {
    font-size: 30px;
    margin-bottom: 15px;
}

.modal p {
    line-height: 1.6;
    opacity: .9;
}

@keyframes pop {
    from {
        transform: scale(.75);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

.shake {
    animation: shake .35s;
}

@keyframes shake {
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-5px); }
}

/* COMPETICIÓN */

.fight-card {
    background: linear-gradient(135deg,#7b1fa2,#311b92);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 15px;
}

.opponent {
    font-size: 25px;
    font-weight: 900;
    margin: 10px 0;
}

.result {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
}

/* RESPONSIVE */

@media(max-width:800px) {
    .game-grid {
        grid-template-columns: 1fr;
    }

    .topbar {
        grid-template-columns: repeat(2,1fr);
    }
}

@media(max-width:450px) {
    .screen {
        padding: 12px;
    }

    .panel {
        padding: 17px;
    }

    .event-title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<!-- =========================
     MENÚ INICIAL
========================= -->

<div id="startScreen" class="screen">
    <div class="menu">

        <div class="logo">Camino al Terrero</div>
        <div class="subtitle">
            Tu carrera. Tus decisiones. Tu historia.
        </div>

        <div class="card">

            <h2>Comienza tu carrera</h2>

            <input
                id="playerName"
                type="text"
                maxlength="20"
                placeholder="Escribe tu nombre"
            >

            <select id="islandSelect">
                <option value="">Selecciona una isla</option>
                <option value="Fuerteventura">Fuerteventura</option>
                <option value="Gran Canaria">Gran Canaria</option>
                <option value="Tenerife">Tenerife</option>
                <option value="La Palma">La Palma</option>
            </select>

            <select id="teamSelect">
                <option value="">Selecciona primero una isla</option>
            </select>

            <button class="main-btn" onclick="startCareer()">
                COMENZAR CARRERA
            </button>

        </div>
    </div>
</div>


<!-- =========================
     JUEGO
========================= -->

<div id="gameScreen" class="hidden">

<div class="game">

    <div class="topbar">

        <div class="info">
            <small>Luchador</small>
            <strong id="nameDisplay">---</strong>
        </div>

        <div class="info">
            <small>Categoría</small>
            <strong id="categoryDisplay">Cadete</strong>
        </div>

        <div class="info">
            <small>Equipo</small>
            <strong id="teamDisplay">---</strong>
        </div>

        <div class="info">
            <small>Temporada</small>
            <strong id="seasonDisplay">1</strong>
        </div>

    </div>


    <div class="game-grid">

        <main class="panel">

            <div id="mainEvent">

                <div class="event-title" id="eventTitle">
                    Comienza tu camino
                </div>

                <div class="event-text" id="eventText">
                    Tu carrera como luchador acaba de comenzar.
                </div>

                <div id="options" class="options"></div>

            </div>

        </main>


        <aside>

            <div class="panel">

                <h2>📊 Estadísticas</h2>

                <div id="stats"></div>

                <div id="specialTrait"></div>

            </div>


            <div class="panel news">

                <h3>📰 Última hora</h3>

                <div id="news"></div>

            </div>

        </aside>

    </div>

</div>
</div>


<!-- =========================
     MODAL
========================= -->

<div id="modalBg" class="modal-bg hidden">

    <div class="modal">

        <h2 id="modalTitle"></h2>

        <p id="modalText"></p>

        <button
            id="modalButton"
            class="main-btn"
            onclick="closeModal()">
            CONTINUAR
        </button>

    </div>

</div>


<script>

/* =====================================================
   EQUIPOS
===================================================== */

const teams = {

    "Fuerteventura": [
        "Club de lucha Unión Antigua ⚪🟢",
        "Rosario Club de Lucha 🔵🔴",
        "Club de lucha Unión Tetir 🔵⚪"
    ],

    "Gran Canaria": [
        "Club de lucha Adargoma ⚪🔴",
        "Club de lucha Castillo del Romeral 🟡🔵",
        "Club de lucha Castro Morales ⚫⚪"
    ],

    "Tenerife": [
        "Club de lucha Chimbesque 🟡🔵",
        "Club de lucha Campitos 🟢⚪",
        "Club de lucha Rosario Valle Guerra ⚪🔴"
    ],

    "La Palma": [
        "Club de lucha Aridane 🟠🔵",
        "Club de lucha Candelaria 🔵⚪",
        "Club de lucha Bediesta ⚫🟢"
    ]
};


/* =====================================================
   JUGADOR
===================================================== */

let player = {

    name: "",
    island: "",
    team: "",

    category: "Cadete",

    season: 1,

    decisions: 0,

    fights: 0,

    seniorCallup: false,

    eliminated: false,

    trait: "normal",

    stats: {
        fuerza: 0,
        tecnica: 0,
        resistencia: 0,
        velocidad: 0,
        mentalidad: 0
    }
};


/* =====================================================
   NOTICIAS
===================================================== */

const newsTexts = [
    "Un equipo ya prepara la próxima jornada.",
    "La afición espera con ganas la siguiente luchada.",
    "Los entrenadores empiezan a preparar nuevas estrategias.",
    "Se acerca una jornada importante.",
    "Varios luchadores jóvenes están llamando la atención.",
    "Los terreros empiezan a llenarse de público.",
    "La temporada sigue avanzando.",
    "Los equipos ultiman sus preparativos."
];

function addNews(text) {

    const news = document.getElementById("news");

    const item = document.createElement("div");

    item.className = "news-item";

    item.textContent = text;

    news.prepend(item);

    while(news.children.length > 5) {
        news.removeChild(news.lastChild);
    }
}


/* =====================================================
   ISLAS
===================================================== */

document
.getElementById("islandSelect")
.addEventListener("change", function(){

    const island = this.value;

    const select = document.getElementById("teamSelect");

    select.innerHTML = "";

    if(!island){

        select.innerHTML =
        `<option value="">Selecciona primero una isla</option>`;

        return;
    }

    teams[island].forEach(team => {

        const option = document.createElement("option");

        option.value = team;
        option.textContent = team;

        select.appendChild(option);

    });

});


/* =====================================================
   GENERACIÓN DE ESTADÍSTICAS
===================================================== */

function randomNormalStat(){

    return Math.floor(Math.random() * 11) + 1;

}


function generateStartingStats(){

    const roll = Math.random() * 100;

    /*
       0 - 4     = Los Ledesma
       4 - 8     = Gigante Herreño
       8 - 100   = Normal
    */

    if(roll < 4){

        player.trait = "Los Ledesma";

        player.stats.fuerza =
            Math.floor(Math.random() * 6) + 10;

        player.stats.tecnica =
            Math.floor(Math.random() * 6) + 10;

        player.stats.resistencia =
            Math.floor(Math.random() * 6) + 10;

        player.stats.velocidad =
            Math.floor(Math.random() * 6) + 10;

        player.stats.mentalidad =
            Math.floor(Math.random() * 6) + 10;

    }

    else if(roll < 8){

        player.trait = "El Gigante Herreño";

        player.stats.fuerza = 40;

        player.stats.tecnica = randomNormalStat();
        player.stats.resistencia = randomNormalStat();
        player.stats.velocidad = randomNormalStat();
        player.stats.mentalidad = randomNormalStat();

    }

    else {

        player.trait = "Normal";

        player.stats.fuerza = randomNormalStat();
        player.stats.tecnica = randomNormalStat();
        player.stats.resistencia = randomNormalStat();
        player.stats.velocidad = randomNormalStat();
        player.stats.mentalidad = randomNormalStat();

    }
}


/* =====================================================
   INICIAR CARRERA
===================================================== */

function startCareer(){

    const name =
        document.getElementById("playerName").value.trim();

    const island =
        document.getElementById("islandSelect").value;

    const team =
        document.getElementById("teamSelect").value;

    if(!name || !island || !team){

        alert("Completa tu nombre, isla y equipo.");

        return;
    }

    player.name = name;
    player.island = island;
    player.team = team;

    generateStartingStats();

    document
    .getElementById("startScreen")
    .classList.add("hidden");

    document
    .getElementById("gameScreen")
    .classList.remove("hidden");

    updateUI();

    addNews("🗞️ ¡Ha comenzado una nueva carrera en el terrero!");

    if(player.trait !== "Normal"){

        setTimeout(() => {

            showModal(
                "✨ Algo especial",
                `Tu carrera comienza con una característica especial: ${player.trait}.`
            );

        }, 500);

    }

    setTimeout(() => {
        nextDecision();
    }, 700);
}


/* =====================================================
   ACTUALIZAR INTERFAZ
===================================================== */

function updateUI(){

    document.getElementById("nameDisplay").textContent =
        player.name;

    document.getElementById("categoryDisplay").textContent =
        player.category;

    document.getElementById("teamDisplay").textContent =
        player.team;

    document.getElementById("seasonDisplay").textContent =
        player.season;

    const statsDiv =
        document.getElementById("stats");

    statsDiv.innerHTML = "";

    const names = {
        fuerza: "💪 Fuerza",
        tecnica: "🥋 Técnica",
        resistencia: "❤️ Resistencia",
        velocidad: "⚡ Velocidad",
        mentalidad: "🧠 Mentalidad"
    };

    for(const stat in player.stats){

        const value = player.stats[stat];

        const container =
            document.createElement("div");

        container.className = "stat";

        container.innerHTML = `
            <div class="stat-head">
                <span>${names[stat]}</span>
                <strong>${value}</strong>
            </div>

            <div class="bar">
                <div class="fill"
                     style="width:${Math.min(value,100)}%">
                </div>
            </div>
        `;

        statsDiv.appendChild(container);
    }

    const traitDiv =
        document.getElementById("specialTrait");

    if(player.trait !== "Normal"){

        traitDiv.innerHTML = `
            <div class="special">
                ✨ ${player.trait}
            </div>
        `;

    } else {

        traitDiv.innerHTML = "";
    }
}


/* =====================================================
   DECISIONES
===================================================== */

const normalDecisions = [

{
    title: "Entrenamiento técnico",
    text: "El entrenador prepara una sesión centrada en técnica.",
    options: [
        {
            text: "🥋 Trabajar la técnica",
            effects: {tecnica: 2},
            result: "Has trabajado duro y notas que tus movimientos son más precisos."
        },
        {
            text: "💪 Priorizar la potencia",
            effects: {fuerza: 2},
            result: "Sales del entrenamiento con buenas sensaciones físicas."
        },
        {
            text: "🧠 Analizar a otros luchadores",
            effects: {mentalidad: 2},
            result: "Aprendes observando cómo luchan los demás."
        }
    ]
},

{
    title: "Día duro",
    text: "El entrenamiento de hoy está siendo especialmente exigente.",
    options: [
        {
            text: "🔥 Aguantar hasta el final",
            effects: {resistencia: 2},
            result: "No te rindes y completas la sesión."
        },
        {
            text: "⚡ Trabajar explosividad",
            effects: {velocidad: 2},
            result: "Trabajas movimientos rápidos y explosivos."
        },
        {
            text: "🧠 Escuchar al entrenador",
            effects: {mentalidad: 2},
            result: "Aprendes a controlar mejor el esfuerzo."
        }
    ]
},

{
    title: "Consejo del entrenador",
    text: "Tu entrenador te pide que elijas en qué aspecto quieres mejorar.",
    options: [
        {
            text: "🥋 Técnica",
            effects: {tecnica: 2},
            result: "El trabajo técnico empieza a dar frutos."
        },
        {
            text: "💪 Fuerza",
            effects: {fuerza: 2},
            result: "Cada vez tienes más potencia."
        },
        {
            text: "❤️ Resistencia",
            effects: {resistencia: 2},
            result: "Tu físico aguanta cada vez más."
        }
    ]
},

{
    title: "Antes de una luchada",
    text: "Quedan pocos días para volver al terrero.",
    options: [
        {
            text: "🎯 Preparar una estrategia",
            effects: {mentalidad: 2},
            result: "Llegas con una idea clara de lo que quieres hacer."
        },
        {
            text: "🏋️ Entrenar fuerte",
            effects: {fuerza: 2, resistencia: 1},
            result: "El entrenamiento ha sido intenso."
        },
        {
            text: "🥋 Perfeccionar movimientos",
            effects: {tecnica: 2},
            result: "Repasas tus movimientos una y otra vez."
        }
    ]
},

{
    title: "Sesión especial",
    text: "El equipo prepara una sesión diferente.",
    options: [
        {
            text: "⚡ Trabajar velocidad",
            effects: {velocidad: 3},
            result: "Tus movimientos se sienten más rápidos."
        },
        {
            text: "💪 Trabajar potencia",
            effects: {fuerza: 3},
            result: "Notas una mejora en tu potencia."
        },
        {
            text: "🧠 Trabajar concentración",
            effects: {mentalidad: 3},
            result: "Aprendes a mantener la calma."
        }
    ]
}
];


/* =====================================================
   SIGUIENTE DECISIÓN
===================================================== */

function nextDecision(){

    if(player.eliminated) return;

    player.decisions++;

    /*
       Cada 2 decisiones hay competición,
       pero la convocatoria Senior aparece
       exactamente después de la tercera.
    */

    if(player.decisions === 3 && !player.seniorCallup){

        showSeniorCallup();

        return;
    }

    if(
        player.seniorCallup &&
        player.decisions > 3 &&
        player.decisions % 2 === 0
    ){

        startFight();

        return;
    }

    showDecision();

}


/* =====================================================
   DECISIÓN NORMAL
===================================================== */

function showDecision(){

    const decision =
        normalDecisions[
            Math.floor(Math.random() * normalDecisions.length)
        ];

    document.getElementById("eventTitle").textContent =
        decision.title;

    document.getElementById("eventText").textContent =
        decision.text;

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    decision.options.forEach(option => {

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent = option.text;

        button.onclick = () => {

            applyEffects(option.effects);

            showResult(
                option.result,
                () => nextDecision()
            );
        };

        options.appendChild(button);
    });


    /*
       MÉTODO PROHIBIDO:
       aparece como opción muy rara,
       nunca como evento obligatorio.
    */

    if(Math.random() < 0.02){

        const cheatingButton =
            document.createElement("button");

        cheatingButton.className =
            "option danger";

        cheatingButton.textContent =
            "⚠️ Hacer trampa";

        cheatingButton.onclick =
            () => prohibitedMethod();

        options.appendChild(cheatingButton);
    }
}


/* =====================================================
   EFECTOS
===================================================== */

function applyEffects(effects){

    for(const stat in effects){

        player.stats[stat] += effects[stat];

        player.stats[stat] =
            Math.max(
                1,
                Math.min(
                    100,
                    player.stats[stat]
                )
            );
    }

    updateUI();
}


/* =====================================================
   RESULTADO
===================================================== */

function showResult(text, callback){

    document.getElementById("eventTitle").textContent =
        "📢 Decisión";

    document.getElementById("eventText").textContent =
        text;

    document.getElementById("options").innerHTML = "";

    const button =
        document.createElement("button");

    button.className = "main-btn";

    button.textContent = "CONTINUAR";

    button.onclick = callback;

    document
    .getElementById("options")
    .appendChild(button);
}


/* =====================================================
   CONVOCATORIA SENIOR
===================================================== */

function showSeniorCallup(){

    document.getElementById("modalTitle").textContent =
        "🥇 ¡Convocado para Senior!";

    document.getElementById("modalText").textContent =
        `El cuerpo técnico de ${player.team} quiere que tengas la oportunidad de luchar en la categoría Senior. 
        Aceptar la convocatoria NO cambia tu categoría oficial: seguirás siendo Cadete. 
        Simplemente podrás participar también en luchadas Senior.`;

    document.getElementById("modalButton").textContent =
        "ACEPTAR CONVOCATORIA";

    document.getElementById("modalButton").onclick =
        acceptSeniorCallup;

    document
    .getElementById("modalBg")
    .classList.remove("hidden");
}


function acceptSeniorCallup(){

    player.seniorCallup = true;

    /*
       IMPORTANTE:
       La categoría sigue siendo Cadete.
    */

    player.category = "Cadete";

    document
    .getElementById("modalBg")
    .classList.add("hidden");

    addNews(
        "🥇 " +
        player.name +
        " ha sido convocado para luchar con el equipo Senior."
    );

    updateUI();

    document.getElementById("eventTitle").textContent =
        "🔥 Una nueva oportunidad";

    document.getElementById("eventText").textContent =
        "Has aceptado la convocatoria. Sigues siendo Cadete, pero ahora puedes disputar luchadas Senior.";

    document.getElementById("options").innerHTML = "";

    const button =
        document.createElement("button");

    button.className = "main-btn";

    button.textContent = "SEGUIR";

    button.onclick = nextDecision;

    document
    .getElementById("options")
    .appendChild(button);
}


/* =====================================================
   COMPETICIONES
===================================================== */

const opponents = [
    "un cadete de otro equipo",
    "un luchador joven muy técnico",
    "un rival conocido por su fuerza",
    "un luchador que destaca por su resistencia",
    "un rival rápido y explosivo",
    "un luchador experimentado"
];


function startFight(){

    player.fights++;

    const opponent =
        opponents[
            Math.floor(Math.random() * opponents.length)
        ];

    document.getElementById("eventTitle").textContent =
        "🏆 DÍA DE COMPETICIÓN";

    document.getElementById("eventText").innerHTML = `
        <div class="fight-card">
            <div>Tu oponente en esta agarrada es:</div>
            <div class="opponent">${opponent}</div>
            <div>¿Qué decides hacer?</div>
        </div>
    `;

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    const choices = [

        {
            text: "🥋 Buscar una pardelera",
            stat: "tecnica",
            success: 0.55
        },

        {
            text: "💪 Intentar imponerte con fuerza",
            stat: "fuerza",
            success: 0.50
        },

        {
            text: "🧠 Esperar un error",
            stat: "mentalidad",
            success: 0.52
        },

        {
            text: "⚡ Atacar rápidamente",
            stat: "velocidad",
            success: 0.48
        }

    ];

    choices.forEach(choice => {

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent = choice.text;

        button.onclick = () => {

            resolveFight(choice);

        };

        options.appendChild(button);
    });
}


/* =====================================================
   RESULTADO LUCHA
===================================================== */

function resolveFight(choice){

    const stat =
        player.stats[choice.stat];

    const bonus =
        Math.min(stat / 100, .40);

    const chance =
        choice.success + bonus - .20;

    const roll =
        Math.random();

    const won =
        roll < chance;

    document.getElementById("options").innerHTML = "";

    if(won){

        player.stats.mentalidad += 1;

        showFightResult(
            "🔥 ¡Has ganado la agarrada!",
            "Tu decisión ha funcionado y consigues imponerte en el terrero."
        );

        addNews(
            `🏆 ${player.name} consigue una victoria en competición.`
        );

    } else {

        player.stats.resistencia =
            Math.max(
                1,
                player.stats.resistencia - 1
            );

        showFightResult(
            "❌ Has perdido la agarrada",
            "El rival consiguió imponerse esta vez. Toca aprender y seguir trabajando."
        );

        addNews(
            `📢 ${player.name} ha sufrido una derrota en competición.`
        );
    }

    updateUI();
}


function showFightResult(title,text){

    document.getElementById("eventTitle").textContent =
        title;

    document.getElementById("eventText").textContent =
        text;

    const button =
        document.createElement("button");

    button.className = "main-btn";

    button.textContent = "CONTINUAR";

    button.onclick = nextDecision;

    document
    .getElementById("options")
    .appendChild(button);
}


/* =====================================================
   MÉTODO PROHIBIDO
===================================================== */

function prohibitedMethod(){

    document.getElementById("eventTitle").textContent =
        "⚠️ Una decisión peligrosa";

    document.getElementById("eventText").textContent =
        "Te han ofrecido la posibilidad de hacer trampa para obtener una ventaja. ¿Quieres arriesgar tu carrera?";

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    const accept =
        document.createElement("button");

    accept.className = "option danger";

    accept.textContent =
        "⚠️ Sí, arriesgarme";

    accept.onclick =
        () => cheatingRoulette();

    const reject =
        document.createElement("button");

    reject.className = "option";

    reject.textContent =
        "❌ No, seguir limpiamente";

    reject.onclick =
        () => {

            showResult(
                "Has decidido seguir tu carrera de forma limpia.",
                () => nextDecision()
            );

        };

    options.appendChild(accept);
    options.appendChild(reject);
}


/* =====================================================
   RULETA
===================================================== */

function cheatingRoulette(){

    document.getElementById("eventTitle").textContent =
        "🎰 La ruleta decide tu destino";

    document.getElementById("eventText").textContent =
        "Hay un 20% de posibilidades de que la trampa no sea detectada y un 80% de que te descubran.";

    document.getElementById("options").innerHTML = "";

    const button =
        document.createElement("button");

    button.className = "main-btn";

    button.textContent =
        "GIRAR RULETA";

    button.onclick = () => {

        button.disabled = true;

        let spins = 0;

        const interval =
            setInterval(() => {

                button.textContent =
                    "🎰 " +
                    Math.floor(Math.random()*100) +
                    "%";

                spins++;

                if(spins >= 12){

                    clearInterval(interval);

                    const success =
                        Math.random() < .20;

                    if(success){

                        player.stats.fuerza += 20;

                        player.stats.fuerza =
                            Math.min(
                                100,
                                player.stats.fuerza
                            );

                        updateUI();

                        showResult(
                            "😮 Nadie te ha descubierto.",
                            () => nextDecision()
                        );

                        addNews(
                            "⚠️ Se rumorea que un luchador obtuvo una ventaja de forma irregular."
                        );

                    } else {

                        endCareer();

                    }
                }

            },100);
    };

    document
    .getElementById("options")
    .appendChild(button);
}


/* =====================================================
   FIN DE CARRERA
===================================================== */

function endCareer(){

    player.eliminated = true;

    document.getElementById("modalTitle").textContent =
        "🚨 CARRERA TERMINADA";

    document.getElementById("modalText").textContent =
        "Has sido descubierto haciendo trampa. Tu carrera deportiva termina aquí.";

    document.getElementById("modalButton").textContent =
        "COMENZAR DE NUEVO";

    document.getElementById("modalButton").onclick =
        () => location.reload();

    document
    .getElementById("modalBg")
    .classList.remove("hidden");
}


/* =====================================================
   MODAL NORMAL
===================================================== */

function showModal(title,text){

    document.getElementById("modalTitle").textContent =
        title;

    document.getElementById("modalText").textContent =
        text;

    document.getElementById("modalButton").textContent =
        "CONTINUAR";

    document.getElementById("modalButton").onclick =
        closeModal;

    document
    .getElementById("modalBg")
    .classList.remove("hidden");
}


function closeModal(){

    document
    .getElementById("modalBg")
    .classList.add("hidden");

}


/* =====================================================
   NOTICIAS AUTOMÁTICAS
===================================================== */

setInterval(() => {

    if(!player.name || player.eliminated) return;

    const text =
        newsTexts[
            Math.floor(Math.random()*newsTexts.length)
        ];

    addNews("📰 " + text);

},30000);

</script>
